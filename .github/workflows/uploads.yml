name: uploads

# Reacts to the coordinator's uploads: anything dropped into uploads/ (voice ZIPs, a
# script.json produced by the Editor page). Processes them, writes the journal, commits,
# then calls build.yml to publish.
#
# Two workflows rather than one: this is the only one that writes to the repo and the
# only one that writes the upload journals (each play's, plus the root one for whatever
# no play claims), so a displayed journal contains ONLY uploads, never the site rebuilds
# triggered by a code push.
#
# Why the explicit call to build.yml: a commit pushed with the GITHUB_TOKEN triggers NO
# other workflow (GitHub's anti-recursion guard). Without this `uses:`, the site would
# never be republished after an upload.
#
# Deliberate order: we commit before deploying (the deployment lives in another job, so
# another runner; waiting for it would mean shipping plays/ and data/ as an artifact).
# If the deployment fails, the data is still in the repo, nothing is lost, and the next
# build publishes it.

on:
  push:
    branches: [main]
    paths:
      - "uploads/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# One processing run at a time: this workflow commits, and two concurrent runs would
# step on each other when several files are dropped in a row. A DIFFERENT group from
# build.yml: a called workflow that shares its caller's group is detected as a deadlock
# and cancelled.
concurrency:
  group: uploads
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    # This job only writes to the repo; it has nothing to do with Pages. The
    # `pages`/`id-token` permissions in the block above exist only so they can be
    # delegated to the `site` job (a called workflow can never obtain more than its
    # caller), not to be used here.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `-maxdepth 2` and not 1: a voice ZIP lives in its play's upload zone,
      # `uploads/<id>/`, so one level deeper than back when there was a single play.
      # At depth 1 no ZIP was found any more, ffmpeg was never installed, and
      # `process_uploads.py` exited with "ffmpeg not found": the run failed, so it
      # committed nothing AND wrote no journal, and the coordinator uploaded voices with
      # nothing happening and nothing said.
      # Not unlimited depth either: an upload zone has only one level, and a ZIP buried
      # deeper would not be processed anyway (see `deposited_files`), so it has no
      # business causing an ffmpeg install.
      - name: Check for voice ZIPs
        id: zips
        run: |
          if find uploads -maxdepth 2 -name '*.zip' -print -quit | grep -q .; then
            echo "present=yes" >> "$GITHUB_OUTPUT"
          else
            echo "present=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Install ffmpeg (only when there are ZIPs to transcode)
        if: ${{ steps.zips.outputs.present == 'yes' }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The upload FOLDER is what says which play a file belongs to:
      # voices -> plays/<id>/clips/*.mp3 plus its clips.json; a script is validated then
      # promoted into its data/. A faulty file is removed and logged, never blocking.
      - name: Process uploaded files
        run: python scripts/process_uploads.py

      - name: Update the upload journals
        run: python scripts/update_history.py

      # One manifest per play, then the index that lists them for the two root pages.
      # In that order: the index reads the manifests.
      - name: Rebuild the manifests and the plays index
        run: |
          python scripts/build_manifest.py
          python scripts/build_plays_index.py

      # `plays` carries everything belonging to a play (script, clips, journal,
      # manifest); `data` only holds the plays index and the journal of uploads no play
      # claimed.
      - name: Commit the plays, the index and the consumed uploads
        run: |
          bash scripts/ci/commit_push.sh "🤖 Process uploads and refresh manifests" \
            plays data uploads

  # Publishes the result. Jobs in the same run: the coordinator sees one green line.
  site:
    needs: process
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/build.yml
