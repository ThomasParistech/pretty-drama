name: uploads

# Processes anything dropped into uploads/ (voice ZIPs, a script.json from the Editor),
# writes the journal, commits, then calls build.yml to publish.
#
# The only workflow that writes to the repo and the only one that writes the journals,
# so a journal holds ONLY uploads, never a site rebuild. The call to build.yml must be
# explicit: a GITHUB_TOKEN push triggers no workflow.
#
# Commit before deploy: the deploy runs on another runner, and if it fails the data is
# still in the repo for the next build.

on:
  push:
    branches: [main]
    paths:
      - "uploads/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# One at a time, since this commits. A DIFFERENT group from build.yml: a called workflow
# sharing its caller's group is detected as a deadlock and cancelled.
concurrency:
  group: uploads
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    # The push that CREATES main matches the paths filter (it adds the .gitkeep files)
    # yet has nothing to process, so it would only put a green "upload handled" tick on
    # a repo with no upload. Same one-liner in build.yml.
    if: github.event.created != true
    # This job never touches Pages; the pages/id-token permissions above exist only to
    # be delegated to `site` (a called workflow never gets more than its caller).
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # -maxdepth 2, not 1: a ZIP lives in uploads/<id>/. At depth 1 none was found,
      # ffmpeg was never installed, and the run failed on "ffmpeg not found" without
      # committing or journalling anything. Not unlimited either: a ZIP buried deeper is
      # not processed at all (see deposited_files), so it must not trigger an install.
      - name: Check for voice ZIPs
        id: zips
        run: |
          if find uploads -maxdepth 2 -name '*.zip' -print -quit | grep -q .; then
            echo "present=yes" >> "$GITHUB_OUTPUT"
          else
            echo "present=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Install ffmpeg (only when there are ZIPs to transcode)
        if: ${{ steps.zips.outputs.present == 'yes' }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Process uploaded files
        run: python scripts/process_uploads.py

      - name: Update the upload journals
        run: python scripts/update_history.py

      # In that order: the index reads the manifests.
      - name: Rebuild the manifests and the plays index
        run: |
          python scripts/build_manifest.py
          python scripts/build_plays_index.py

      # git status and not uploads_result.json: what needs re-typesetting is exactly what
      # CHANGED on disk, so a byte-identical promotion typesets nothing. -uall because a
      # play born in this run has an untracked script.json and git would report the
      # folder. Play ids are [a-z0-9-], so no quoting to undo.
      - name: Look for scripts promoted by this run
        id: typeset
        run: |
          plays="$(git status --porcelain -uall -- 'plays/*/data/script.json' \
            | awk '{print $2}' | cut -d/ -f2 | sort -u | tr '\n' ' ')"
          echo "plays=$plays" >> "$GITHUB_OUTPUT"
          if [ -n "$plays" ]; then echo "Scripts to typeset: $plays"; fi

      - name: Install LaTeX (only when a script was promoted)
        if: ${{ steps.typeset.outputs.plays != '' }}
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended texlive-lang-french texlive-fonts-recommended lmodern

      # Distro TeX and nothing else: tectonic is faster but wants a pinned release URL, a
      # sha256 to bump and an actions/cache, three things that rot in a repo a troupe
      # copies and leaves alone for years.
      #
      # The PDF is a convenience, never a condition: continue-on-error here and
      # build_script_pdf.py exits 0, so a script that breaks LaTeX is still promoted.
      #
      # DELETED FIRST: the script just changed, so a failed typesetting must commit an
      # absence (button 404s, which is the truth) rather than a document that silently
      # disagrees with the play. Through env:, never interpolated into run:.
      - name: Typeset the printable script of the plays that changed
        if: ${{ steps.typeset.outputs.plays != '' }}
        continue-on-error: true
        env:
          PLAYS: ${{ steps.typeset.outputs.plays }}
        run: |
          for play in $PLAYS; do
            rm -f "plays/$play/data/script.pdf"
          done
          python scripts/build_script_pdf.py $PLAYS

      # plays: everything belonging to a play. data: the index plus the journal of
      # uploads no play claimed.
      - name: Commit the plays, the index and the consumed uploads
        run: |
          bash scripts/ci/commit_push.sh "🤖 Process uploads and refresh manifests" \
            plays data uploads

  # contents: read, because build.yml writes nothing to the repo. A called workflow
  # never gets more than its caller granted, so anything build.yml ever starts
  # committing has to be delegated here too.
  site:
    needs: process
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/build.yml
