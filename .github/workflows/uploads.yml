name: uploads

# Réagit aux dépôts du respo : tout ce qu'il glisse dans uploads/ (ZIP de voix
# des acteurs, script.json produit par la page Édition). Traite, consigne le
# journal, commite, puis appelle build.yml pour publier.
#
# Deux workflows et pas un seul : celui-ci est le seul à écrire dans le dépôt et
# le seul à écrire les journaux de dépôt (celui de chaque pièce, plus celui de la
# racine pour ce qu'aucune pièce ne réclame), donc un journal affiché ne contient QUE
# des dépôts, jamais les reconstructions du site déclenchées par un push de code.
#
# Pourquoi un appel explicite à build.yml : un commit poussé avec le
# GITHUB_TOKEN ne déclenche AUCUN autre workflow (garde anti-récursion de
# GitHub). Sans ce `uses:`, le site ne serait jamais republié après un dépôt.
#
# Ordre assumé : on commite avant de déployer (le déploiement vit dans un autre
# job, donc un autre runner ; l'attendre imposerait de transporter plays/ et
# data/ en artefact). Si le déploiement échoue, les données restent dans le
# dépôt, rien n'est perdu et le prochain build les publie.

on:
  push:
    branches: [main, master]
    paths:
      - "uploads/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Un seul traitement à la fois : ce workflow commite, deux exécutions
# concurrentes se marcheraient dessus quand plusieurs fichiers sont déposés à la
# suite. Groupe DIFFÉRENT de celui de build.yml : un workflow appelé qui partage
# le groupe de son appelant est détecté comme interblocage et annulé.
concurrency:
  group: uploads
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    # Ce job ne fait qu'écrire dans le dépôt : il n'a rien à voir avec Pages.
    # Les permissions `pages`/`id-token` du bloc du haut n'existent que pour
    # pouvoir les déléguer au job `site` (un workflow appelé ne peut jamais
    # obtenir plus que son appelant), pas pour être servies ici.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `-maxdepth 2` et pas 1 : un ZIP de voix vit dans la zone de dépôt de sa
      # pièce, `uploads/<id>/`, donc un niveau plus bas que du temps de la pièce
      # unique. Avec la profondeur 1, plus aucun ZIP n'était trouvé, ffmpeg n'était
      # jamais installé, et `process_uploads.py` sortait en « ffmpeg introuvable » :
      # le run échouait, donc il ne commitait rien ET n'écrivait aucun journal, et le
      # respo déposait des voix sans que rien ne se passe ni ne se dise.
      # Pas de profondeur illimitée pour autant : une zone de dépôt n'a qu'un niveau,
      # et un ZIP enfoui plus bas ne serait de toute façon pas traité (cf.
      # `deposited_files`), donc il n'a pas à faire installer ffmpeg.
      - name: Check for voice ZIPs
        id: zips
        run: |
          if find uploads -maxdepth 2 -name '*.zip' -print -quit | grep -q .; then
            echo "present=yes" >> "$GITHUB_OUTPUT"
          else
            echo "present=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Install ffmpeg (only when there are ZIPs to transcode)
        if: ${{ steps.zips.outputs.present == 'yes' }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # C'est le DOSSIER de dépôt qui dit de quelle pièce un fichier est :
      # voix -> plays/<id>/clips/*.mp3 + son clips.json, script validé puis promu dans
      # son data/. Un fichier fautif est retiré et consigné, jamais bloquant.
      - name: Process uploaded files
        run: python scripts/process_uploads.py

      - name: Update the deposits journals
        run: python scripts/update_history.py

      # Un manifest par pièce, puis l'index qui les liste pour les deux pages
      # racine. Dans cet ordre : l'index lit les manifests.
      - name: Rebuild the manifests and the plays index
        run: |
          python scripts/build_manifest.py
          python scripts/build_plays_index.py

      # `plays` porte tout ce qui appartient à une pièce (script, clips, journal,
      # manifest) ; `data` ne garde que l'index des pièces et le journal des dépôts
      # qu'aucune pièce n'a réclamés.
      - name: Commit the plays, the index and the consumed uploads
        run: |
          bash scripts/ci/commit_push.sh "🤖 Traitement des dépôts et mise à jour des manifests" \
            plays data uploads

  # Publie le résultat. Jobs du même run : le respo voit une seule ligne verte.
  site:
    needs: process
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/build.yml
