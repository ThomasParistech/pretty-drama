name: build

# Builds the site, deploys it to Pages, then writes the address into the README.
# Writes nothing else to the repo: the journals have a single writer, uploads.yml,
# which processes uploads then calls this workflow (a GITHUB_TOKEN push triggers no
# workflow, so the call must be explicit; the same rule keeps the README commit from
# looping back here).
#
# paths-ignore uploads/**: without it an upload triggers both workflows in parallel
# and publishes a site without the new voices.

on:
  push:
    branches: [main]
    paths-ignore:
      - "uploads/**"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# A DIFFERENT group from uploads.yml: a called workflow sharing its caller's group is
# detected as a deadlock and cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # No workflow can switch Pages on (needs administration:write), so this looks and
  # explains. It FAILS when publishing is off: the coordinator's only other channel is
  # the Dashboard journal, which lives on the very site that is missing, so GitHub's
  # e-mail is the report. A separate job so it answers in four seconds and GitHub names
  # it in that mail. build_type and not mere existence: publishing from a branch serves
  # the repo root, whose index.html points at /src/, so a blank page instead of a 404.
  pages-check:
    name: Is the site allowed to be published
    runs-on: ubuntu-latest
    # The push that CREATES main is the one run not judged, and skipping it is what
    # earns the right to fail all the others: README step 2 has not happened yet, so
    # failing would mail an English "Run failed" to someone doing as told. A job-level
    # `if` is the only construct that can skip on that.
    if: github.event.created != true
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `|| true`: 404 when Pages was never switched on, and gh exits non-zero.
          build_type="$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || true)"
          if [ "$build_type" = "workflow" ]; then
            exit 0
          fi

          if [ -z "$build_type" ]; then
            title="GitHub Pages is not switched on yet"
            symptom="the site address answers 404"
          else
            title="GitHub Pages is publishing from a branch, not from GitHub Actions"
            symptom="the site address shows a blank page"
          fi

          {
            echo "## $title"
            echo
            echo "The site was NOT published, and nothing was lost: everything already"
            echo "sent is safe in this repository. Right now, $symptom."
            echo
            echo "Publishing has to be switched on by a human, once. GitHub does not let"
            echo "any workflow do it for you."
            echo
            echo "1. Open <https://github.com/${{ github.repository }}/settings/pages>"
            echo "2. Under **Source**, choose **GitHub Actions**"
            echo "3. Come back to the **Actions** tab, choose **build** on the left,"
            echo "   then press **Run workflow**"
            echo
            echo "Step 3 is also how you publish the whole site again at any time,"
            echo "without having to upload anything."
          } >> "$GITHUB_STEP_SUMMARY"

          # The annotation carries the whole fix: it is what shows on the run page and
          # in the checks list without opening anything.
          echo "::error title=$title::Settings > Pages > Source > GitHub Actions, then Actions > build > Run workflow. Full instructions in this run's summary."
          exit 1

  build:
    runs-on: ubuntu-latest
    # Only knowable here: <owner>.github.io/<repo>/, and both halves change when the
    # template is copied.
    outputs:
      page_url: ${{ steps.deploy.outputs.page_url }}
    # `needs` alone is the gate: pages-check failing or skipping both leave this
    # skipped, and its own row (red or grey) carries the distinction.
    needs: pages-check
    steps:
      # Explicit ref: called from uploads.yml we run inside the run of a push made
      # BEFORE the commit that workflow pushed, so the triggering SHA would publish a
      # site without the voices just processed.
      - name: Checkout (head of the branch, not the triggering SHA)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Node 24: 20 is end-of-life since April 2026. npm 11 skips esbuild's
          # postinstall, harmless since the binary comes from @esbuild/linux-x64.
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install front dependencies
        run: npm ci

      - name: Run tests (normalization + statuses + ZIP contract + journal + contracts)
        run: python -m unittest discover -s scripts/tests -v

      - name: Run front tests (reducer, undo stack, shared helpers)
        run: npm test

      # Derived, so rebuilt here to survive a hand edit in the repo. The index reads the
      # manifests, hence the order. Nothing is committed: only uploads.yml writes.
      - name: Rebuild the manifests and the plays index
        run: |
          python scripts/build_manifest.py
          python scripts/build_plays_index.py

      # No PDF built here: script.pdf is committed data, typeset by uploads.yml on
      # promotion, and rsync carries it into dist/ like any other file. The counterpart
      # is written in .gitignore, uploads.yml and build_script_pdf.py: a script.json
      # edited by hand IN THE REPO keeps its old PDF until the next upload.

      # --exclude='*.html' is mandatory, not a precaution: plays/<id>/*.html are the
      # worktree templates, the dist/ ones are Vite's with hashed asset URLs, so
      # copying over them serves /src/rehearsal/main.jsx and a blank page.
      # The mkdir -p cover a repo with no play at all (fresh fork): plays/ and
      # dist/plays/ then do not exist and rsync fails on a missing source, yet that
      # site is precisely the one carrying the create-a-play page.
      - name: Build site
        run: |
          npm run build
          mkdir -p data plays dist/plays
          cp -r data dist/data
          rsync -a --exclude='*.html' plays/ dist/plays/

      # No `enablement: true`: it needs administration:write, so it could only answer
      # 403, and the action throws on anything but a 409. pages-check already
      # guarantees Pages is on and building from a workflow.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      # Since v4 this action excludes hidden files. Keep it that way: the only dotfiles
      # reaching dist/ are the .gitkeep rsync carries along.
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

      # The two addresses on the page the coordinator is already looking at (README
      # step 3 leaves them here). The management one exists nowhere else, being the
      # site's plus respo.html. Hard-coded rather than read from PATHS so this table
      # cannot depend on the README job having worked; add a page here and it belongs
      # in PATHS too.
      - name: Print the site's addresses in the run summary
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          base="${PAGE_URL%/}"
          {
            echo "## The site is online"
            echo
            echo "| Address | For whom |"
            echo "| --- | --- |"
            echo "| <$base/> | the troupe. This is the link you share. |"
            echo "| <$base/respo.html> | you: managing the plays. Bookmark it, nothing links to it from the other address. |"
            echo
            echo "They are written into this repository's README as well, so you never"
            echo "have to come back here to find them."
          } >> "$GITHUB_STEP_SUMMARY"

  # The ONE place this workflow touches the repo. The README ships its site links on
  # example.com placeholders tagged `<!-- ref: SITE_… -->`; the script fills the
  # targets in, the address being unknowable before a deployment.
  # A separate job so `build` keeps contents: read and commits from a clean checkout
  # rather than a worktree full of rebuilt manifests. continue-on-error so a
  # convenience can never redden a run that PUBLISHED; the next deployment retries.
  # No loop: a GITHUB_TOKEN push triggers no workflow, and the script is a no-op from
  # the second run on.
  readme:
    name: Write the site address into the README
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    # The only contents: write here, and the reason uploads.yml must delegate it on its
    # `site` job: a called workflow never gets more than its caller. pages: read is for
    # the fallback below.
    permissions:
      contents: write
      pages: read
    steps:
      # Same ref reason as the build's checkout: committing on the older SHA would
      # rebase away a whole upload.
      - name: Checkout (head of the branch, not the triggering SHA)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      # Two sources: losing the address leaves the links on example.com until another
      # deployment. page_url is the one to trust; the Pages API covers a renamed output
      # of a future deploy-pages. Through env:, never interpolated into the script.
      - name: Point the README's links at the address the deployment answered on
        env:
          PAGE_URL: ${{ needs.build.outputs.page_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          url="$PAGE_URL"
          if [ -z "$url" ]; then
            echo "deploy-pages returned no page_url; asking the Pages API instead."
            url="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url 2>/dev/null || true)"
          fi
          if [ -z "$url" ]; then
            echo "::error title=README site links::the site's address could not be determined."
            exit 1
          fi
          python3 scripts/ci/update_readme_urls.py "$url"

      # No-op once the links point at the site: commit_push.sh finds an empty index.
      - name: Commit the README if its links changed
        run: bash scripts/ci/commit_push.sh "🤖 Write the site address into the README" README.md
