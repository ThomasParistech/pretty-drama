name: build

# Construit le site et le déploie sur GitHub Pages. Rien d'autre : ce workflow
# n'écrit JAMAIS dans le dépôt (pas de commit, pas de journal). Le seul écrivain
# est uploads.yml, qui traite les dépôts puis appelle celui-ci (`workflow_call`)
# parce qu'un commit poussé avec le GITHUB_TOKEN ne déclenche aucun workflow.
#
# `paths-ignore: uploads/**` : un dépôt est l'affaire d'uploads.yml, qui finit
# par nous appeler. Sans ce filtre, un dépôt déclencherait les deux en parallèle
# et publierait un site sans les nouvelles voix.
#
# Le respo ne vient jamais sur GitHub en dehors du dépôt de fichiers : ce
# workflow ne lui écrit donc rien ici, ni issue ni statut dans le README. Son
# seul retour est le journal des dépôts de la page Avancement.

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "uploads/**"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement Pages à la fois. Groupe DIFFÉRENT de celui d'uploads.yml :
# un workflow appelé qui partage le groupe de son appelant est détecté comme
# interblocage et annulé.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # `ref` explicite : appelés depuis uploads.yml, nous tournons dans le run
      # d'un push ANTÉRIEUR au commit que ce workflow vient de pousser. Sans
      # cela, checkout prendrait ce SHA d'origine et publierait un site sans les
      # voix qu'on vient de traiter.
      - name: Checkout (head of the branch, not the triggering SHA)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Node 24 (LTS Krypton) : Node 20 est en fin de vie depuis avril 2026.
          # Le `npm ci` qui suit tourne donc avec npm 11, qui n'exécute plus les
          # scripts d'installation sans accord explicite et saute le postinstall
          # d'esbuild : sans effet, le binaire vient du paquet de plateforme
          # `@esbuild/linux-x64` et `vite build` s'en contente (vérifié).
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install front dependencies
        run: npm ci

      - name: Run tests (normalization + statuses + ZIP contract + journal + contrats)
        run: python -m unittest discover -s scripts/tests -v

      # Logique pure du front : réparation d'un script.json douteux, pile
      # d'annulation, helpers partagés. `node --test` est intégré à Node, il n'y
      # a donc aucune dépendance de test à installer.
      - name: Run front tests (reducer, undo stack, shared helpers)
        run: npm test

      # Le manifest est dérivé : on le reconstruit pour que le site déployé
      # colle à script.json et clips.json même après une édition à la main dans
      # le dépôt. Il n'est PAS commité (seul uploads.yml écrit dans le dépôt).
      - name: Rebuild data/manifest.json
        run: python scripts/build_manifest.py

      - name: Build site
        run: |
          npm run build
          cp -r data dist/data
          mkdir -p clips
          cp -r clips dist/clips

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          # Auto-enables Pages (source: GitHub Actions) on first run when the
          # token has the required permissions; otherwise the respo enables it
          # once in Settings -> Pages.
          enablement: true

      # Depuis la v4 cette action EXCLUT les fichiers cachés de l'artefact (il
      # existe un `include-hidden-files` pour les rattraper). Sans effet ici, et
      # à garder ainsi : rien de ce que le site sert ne commence par un point.
      # Le seul dotfile qui arrive dans dist/ est le clips/.gitkeep recopié
      # au-dessus, qui n'a aucune raison d'être publié.
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
