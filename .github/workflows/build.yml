name: build

# Builds the site and deploys it to GitHub Pages. Nothing else: this workflow NEVER
# writes to the repo (no commit, no journal). The only writer is uploads.yml, which
# processes uploads and then calls this one (`workflow_call`), because a commit pushed
# with the GITHUB_TOKEN triggers no workflow.
#
# `paths-ignore: uploads/**`: an upload is uploads.yml's business, and it ends up
# calling us. Without this filter an upload would trigger both in parallel and publish
# a site without the new voices.
#
# The coordinator never visits GitHub except to drop files, so this workflow writes
# nothing for them here, no issue and no README status. Their only feedback is the upload
# journal on the Dashboard page. Single exception, the `pages-check` job below: when
# publishing is off, that journal sits on a site that does not exist, so the run summary
# has to say so itself. It says it without failing, so GitHub sends no e-mail either.

on:
  push:
    branches: [main]
    paths-ignore:
      - "uploads/**"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time. A DIFFERENT group from uploads.yml: a called
# workflow that shares its caller's group is detected as a deadlock and cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Pages is switched on BY HAND, once, and no workflow can ever do it for the
  # coordinator: creating a Pages site needs `administration:write`, a permission a
  # workflow token cannot even ask for (hence the `enablement` input of configure-pages
  # wanting a PAT or a GitHub App). So this job does not try. It looks, and it explains.
  #
  # It FAILS the run when publishing is off, and the e-mail GitHub then sends is wanted,
  # not tolerated. The one case where that e-mail would have been unfair is the push that
  # creates the repository, and that push is skipped below, so every run that reaches
  # here belongs to a repository whose install protocol is over: an upload that cannot go
  # online, or a manual publish that cannot publish, is a real problem, and this project
  # has no other way to say so (the Dashboard journal is on the very site that is
  # missing). Silence, or a green tick over a site that never went up, would be worse
  # than a scare.
  #
  # A SEPARATE JOB, not a first step of `build`: it fails in four seconds instead of
  # after tests, npm build and LaTeX, GitHub names the failing job in the e-mail, so
  # "Is the site allowed to be published" is already the diagnosis, and `build` shows as
  # skipped rather than dragging a red herring of its own.
  #
  # `build_type` and not mere existence: Pages switched on but publishing FROM A BRANCH
  # would let the deploy fail much later AND serve the repository root, whose index.html
  # points at /src/chooser/main.jsx, so the address answers with a blank page rather than
  # a 404. Same missing setting, worse symptom, caught here too.
  #
  # English, like every other workflow here. The coordinator reads French, but this text
  # lives in the Actions tab and the README is what walks them to it; guiding them is the
  # README's job, not this one's.
  pages-check:
    name: Is the site allowed to be published
    runs-on: ubuntu-latest
    # The push that CREATES main, i.e. the template being copied, is the ONE run this
    # check does not judge, and skipping it is what earns the right to fail all the
    # others. At that instant the repository is seconds old, Pages cannot be on yet, and
    # nothing is supposed to publish: the README's step 2 has not happened. Failing there
    # would mail an English "Run failed" to someone doing exactly as told, and succeeding
    # there would put a green tick on the initial commit of a repository that has no
    # site. Grey is the only honest answer, and a job-level `if` is the only way to get
    # it, since this job cannot skip itself on an answer that exists only at runtime.
    if: github.event.created != true
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `|| true`: the endpoint answers 404 when Pages was never switched on, and
          # `gh api` exits non-zero, which would fail the step before it can explain.
          build_type="$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || true)"
          if [ "$build_type" = "workflow" ]; then
            exit 0
          fi

          if [ -z "$build_type" ]; then
            title="GitHub Pages is not switched on yet"
            symptom="the site address answers 404"
          else
            title="GitHub Pages is publishing from a branch, not from GitHub Actions"
            symptom="the site address shows a blank page"
          fi

          {
            echo "## $title"
            echo
            echo "The site was NOT published, and nothing was lost: everything already"
            echo "sent is safe in this repository. Right now, $symptom."
            echo
            echo "Publishing has to be switched on by a human, once. GitHub does not let"
            echo "any workflow do it for you."
            echo
            echo "1. Open <https://github.com/${{ github.repository }}/settings/pages>"
            echo "2. Under **Source**, choose **GitHub Actions**"
            echo "3. Come back to the **Actions** tab, choose **build** on the left,"
            echo "   then press **Run workflow**"
            echo
            echo "Step 3 is also how you publish the whole site again at any time,"
            echo "without having to upload anything."
          } >> "$GITHUB_STEP_SUMMARY"

          # The annotation carries the whole fix, because it is what shows on the run page
          # and in the checks list without opening anything. The summary above is the
          # same thing with room to breathe.
          echo "::error title=$title::Settings > Pages > Source > GitHub Actions, then Actions > build > Run workflow. Full instructions in this run's summary."
          exit 1

  build:
    runs-on: ubuntu-latest
    # No `if`: `needs` alone is the gate. pages-check failing (publishing off) or being
    # skipped (the repository being created) both leave this job skipped, which is what
    # should show in the checks list either way. The distinction the coordinator needs is
    # carried by pages-check's own row, red or grey.
    needs: pages-check
    steps:
      # Explicit `ref`: when called from uploads.yml we run inside the run of a push
      # made BEFORE the commit that workflow just pushed. Without this, checkout would
      # take that original SHA and publish a site without the voices we just
      # processed.
      - name: Checkout (head of the branch, not the triggering SHA)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Node 24 (LTS Krypton): Node 20 has been end-of-life since April 2026.
          # The `npm ci` below therefore runs with npm 11, which no longer runs
          # install scripts without explicit consent and skips esbuild's postinstall.
          # No consequence: the binary comes from the `@esbuild/linux-x64` platform
          # package and `vite build` is happy with it (verified).
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install front dependencies
        run: npm ci

      - name: Run tests (normalization + statuses + ZIP contract + journal + contracts)
        run: python -m unittest discover -s scripts/tests -v

      # Pure front logic: repairing a dubious script.json, the undo stack, shared
      # helpers. `node --test` ships with Node, so there is no test dependency to
      # install.
      - name: Run front tests (reducer, undo stack, shared helpers)
        run: npm test

      # Manifests are derived: we rebuild them so the deployed site matches the
      # script.json and clips.json files even after a hand edit in the repo, and the
      # plays index with them (it reads the manifests, so it comes after). Nothing is
      # committed here; only uploads.yml writes to the repo.
      - name: Rebuild the manifests and the plays index
        run: |
          python scripts/build_manifest.py
          python scripts/build_plays_index.py

      # The script PDF is a convenience, never a deployment condition: hence the
      # continue-on-error here, and the exit code 0 that build_script_pdf.py returns
      # even when LaTeX fails. Without those two nets, one malformed line would make
      # the whole site disappear with no warning to the coordinator (this workflow writes
      # neither issue nor journal, so it has no way to tell them).
      #
      # Distro TeX packages, and nothing else. tectonic was tried and dropped: it is
      # faster in steady state (a 26 MB static binary, ~0.5 s of compilation against
      # 0.25 s here, against ~300 MB of packages), but it required a pinned release
      # URL, a sha256 to carry forward on every version bump, and an `actions/cache`
      # to avoid re-paying 40 s of TeX file downloads. Three things that rot, in a
      # repo meant to be forked by a troupe and left alone for years, all to save
      # under a minute on a job that runs about once a week. The apt packages are
      # signed by the distro, still resolve in ten years, and add no trust
      # relationship.
      - name: Install LaTeX (script PDF)
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended texlive-lang-french texlive-fonts-recommended lmodern

      # Writes plays/<id>/data/script.pdf, which the copy of plays/ below carries into
      # dist/. So it must stay BEFORE "Build site".
      - name: Build the printable script of every play
        continue-on-error: true
        run: python scripts/build_script_pdf.py

      # `npm run build` writes the seven pages of each play itself, from the templates
      # in `pages/` (see vite.config.js), so dist/plays/<id>/ already exists when we
      # copy the play's data and clips into it.
      #
      # Excluding the `.html` files is not a precaution, it is necessary:
      # `plays/<id>/*.html` are the templates instantiated verbatim in the worktree
      # (gitignored), whereas the ones in `dist/` are the version Vite wrote, with
      # hashed asset URLs. Copying over them would serve a site referencing
      # `/src/rehearsal/main.jsx`, so a blank page.
      #
      # The two `mkdir -p` are not decorative: a repo with no play at all is a
      # reachable state (a brand new fork, or the example play deleted to start
      # clean), and then `plays/` does not exist, `dist/plays/` does not either (Vite
      # wrote no play page), and `rsync` would fail on a missing source directory. The
      # site must build anyway: it is precisely the site that carries the page where
      # you create your first play. Same precaution as the earlier `mkdir -p clips`,
      # and for the same reason.
      - name: Build site
        run: |
          npm run build
          mkdir -p data plays dist/plays
          cp -r data dist/data
          rsync -a --exclude='*.html' plays/ dist/plays/

      # No `enablement: true` here, and that is not an omission: it needs
      # `administration:write`, which GITHUB_TOKEN cannot carry, so it could only ever
      # answer 403 ("Resource not accessible by integration"), and the action THROWS on
      # anything but a 409. It never enabled anything; it just moved the failure. The
      # `pages-check` job is what guarantees Pages is on and building from a workflow,
      # and this job does not even start otherwise, so there is nothing left to enable.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      # Since v4 this action EXCLUDES hidden files from the artifact (there is an
      # `include-hidden-files` to bring them back). No effect here, and to be kept
      # that way: nothing the site serves starts with a dot. The dotfiles that reach
      # dist/ are the `.gitkeep` files rsync carries along with the plays (one keeps
      # `plays/` alive in git, one per play keeps its `clips/`), and none of them has
      # any reason to be published.
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
