name: build

# Construit le site et le déploie sur GitHub Pages. Rien d'autre : ce workflow
# n'écrit JAMAIS dans le dépôt (pas de commit, pas de journal). Le seul écrivain
# est uploads.yml, qui traite les dépôts puis appelle celui-ci (`workflow_call`)
# parce qu'un commit poussé avec le GITHUB_TOKEN ne déclenche aucun workflow.
#
# `paths-ignore: uploads/**` : un dépôt est l'affaire d'uploads.yml, qui finit
# par nous appeler. Sans ce filtre, un dépôt déclencherait les deux en parallèle
# et publierait un site sans les nouvelles voix.
#
# Le respo ne vient jamais sur GitHub en dehors du dépôt de fichiers : ce
# workflow ne lui écrit donc rien ici, ni issue ni statut dans le README. Son
# seul retour est le journal des dépôts de la page Avancement.

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "uploads/**"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement Pages à la fois. Groupe DIFFÉRENT de celui d'uploads.yml :
# un workflow appelé qui partage le groupe de son appelant est détecté comme
# interblocage et annulé.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # `ref` explicite : appelés depuis uploads.yml, nous tournons dans le run
      # d'un push ANTÉRIEUR au commit que ce workflow vient de pousser. Sans
      # cela, checkout prendrait ce SHA d'origine et publierait un site sans les
      # voix qu'on vient de traiter.
      - name: Checkout (head of the branch, not the triggering SHA)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Node 24 (LTS Krypton) : Node 20 est en fin de vie depuis avril 2026.
          # Le `npm ci` qui suit tourne donc avec npm 11, qui n'exécute plus les
          # scripts d'installation sans accord explicite et saute le postinstall
          # d'esbuild : sans effet, le binaire vient du paquet de plateforme
          # `@esbuild/linux-x64` et `vite build` s'en contente (vérifié).
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install front dependencies
        run: npm ci

      - name: Run tests (normalization + statuses + ZIP contract + journal + contrats)
        run: python -m unittest discover -s scripts/tests -v

      # Logique pure du front : réparation d'un script.json douteux, pile
      # d'annulation, helpers partagés. `node --test` est intégré à Node, il n'y
      # a donc aucune dépendance de test à installer.
      - name: Run front tests (reducer, undo stack, shared helpers)
        run: npm test

      # Les manifests sont dérivés : on les reconstruit pour que le site déployé
      # colle aux script.json et clips.json même après une édition à la main dans
      # le dépôt, et l'index des pièces avec eux (il les lit, donc il vient après).
      # Rien n'est commité ici (seul uploads.yml écrit dans le dépôt).
      - name: Rebuild the manifests and the plays index
        run: |
          python scripts/build_manifest.py
          python scripts/build_plays_index.py

      # Le PDF du script est un confort, jamais une condition de déploiement :
      # d'où le continue-on-error ici, et le code de retour 0 que
      # build_script_pdf.py rend même quand LaTeX échoue. Sans ces deux
      # filets, une réplique mal formée ferait disparaître le site entier
      # sans que le respo en soit averti (ce workflow n'écrit ni issue ni
      # journal, il n'a aucun moyen de le lui dire).
      # Les paquets TeX de la distribution, et rien d'autre. tectonic a été
      # essayé et écarté : plus rapide en régime établi (un binaire statique de
      # 26 Mo, ~0,5 s de compilation contre 0,25 s ici, contre ~300 Mo de
      # paquets), mais il demandait une URL de release figée, une empreinte
      # sha256 à faire suivre à chaque montée de version et un cache
      # `actions/cache` pour ne pas repayer 40 s de téléchargement de fichiers
      # TeX. Trois choses qui pourrissent, dans un dépôt fait pour être forké
      # par une troupe et laissé tranquille des années, et tout ça pour gagner
      # moins d'une minute sur un job qui tourne une fois par semaine. Les
      # paquets apt sont signés par la distribution, se résolvent encore dans
      # dix ans et n'ajoutent aucune relation de confiance.
      - name: Install LaTeX (script PDF)
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended texlive-lang-french texlive-fonts-recommended lmodern

      # Écrit plays/<id>/data/script.pdf, que la copie de plays/ ci-dessous emporte
      # dans dist/. Doit donc rester AVANT « Build site ».
      - name: Build the printable script of every play
        continue-on-error: true
        run: python scripts/build_script_pdf.py

      # `npm run build` écrit lui-même les sept pages de chaque pièce depuis les
      # gabarits de `pages/` (cf. vite.config.js), donc dist/plays/<id>/ existe déjà
      # quand on y recopie les données et les clips de la pièce.
      #
      # L'exclusion des `.html` n'est pas une précaution, elle est nécessaire :
      # `plays/<id>/*.html` sont les gabarits instanciés en clair dans l'arbre de
      # travail (gitignorés), alors que ceux de `dist/` sont la version que Vite a
      # écrite, avec les URLs d'assets hachées. Les recopier par-dessus servirait un
      # site qui référence `/src/rehearsal/main.jsx`, donc une page blanche.
      # Les deux `mkdir -p` ne sont pas décoratifs : un dépôt sans aucune pièce est
      # un état atteignable (fork tout neuf, ou pièce d'exemple supprimée pour
      # partir propre), et alors `plays/` n'existe pas, `dist/plays/` non plus
      # (Vite n'a écrit aucune page de pièce), et `rsync` échouerait sur un dossier
      # source absent. Le site doit se construire quand même : c'est justement lui
      # qui porte la page où l'on crée sa première pièce. Même précaution que le
      # `mkdir -p clips` d'avant, et pour la même raison.
      - name: Build site
        run: |
          npm run build
          mkdir -p data plays dist/plays
          cp -r data dist/data
          rsync -a --exclude='*.html' plays/ dist/plays/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          # Auto-enables Pages (source: GitHub Actions) on first run when the
          # token has the required permissions; otherwise the respo enables it
          # once in Settings -> Pages.
          enablement: true

      # Depuis la v4 cette action EXCLUT les fichiers cachés de l'artefact (il
      # existe un `include-hidden-files` pour les rattraper). Sans effet ici, et
      # à garder ainsi : rien de ce que le site sert ne commence par un point.
      # Le seul dotfile qui arrive dans dist/ est le clips/.gitkeep recopié
      # au-dessus, qui n'a aucune raison d'être publié.
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
