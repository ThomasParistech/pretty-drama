name: build

# Builds the site and deploys it to Pages. Writes NOTHING to the repo, hence
# `contents: read` throughout and nothing to delegate when uploads.yml calls it: the
# journals have a single writer, uploads.yml, which processes uploads then calls this
# workflow (a GITHUB_TOKEN push triggers no workflow, so the call must be explicit).
#
# The site's address is not written anywhere by this workflow. It is not knowable
# before a deployment (<owner>.github.io/<repo>/, both halves change when the template
# is copied), and GitHub already displays it in two places the coordinator owns:
# Settings > Pages, and the repository's About panel once they tick "Use your GitHub
# Pages website". Settings > Pages is the live one; the About panel is a SNAPSHOT into
# the repo's `homepage` field, so a rename leaves it dead until re-ticked. Neither
# needs a commit, and neither can be automated: writing `homepage` needs
# administration:write, the same permission that blocks enabling Pages.
#
# paths-ignore uploads/**: without it an upload triggers both workflows in parallel
# and publishes a site without the new voices.

on:
  push:
    branches: [main]
    paths-ignore:
      - "uploads/**"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# A DIFFERENT group from uploads.yml: a called workflow sharing its caller's group is
# detected as a deadlock and cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The push that CREATES main is the one run not judged, and skipping it is what
    # earns the right to fail all the others: the coordinator has not been asked to
    # switch Pages on yet, so failing would mail an English "Run failed" to someone
    # doing as told. A job-level `if` is the only construct that can skip on that,
    # the check below having an answer only at runtime.
    if: github.event.created != true
    steps:
      # No workflow can switch Pages on (needs administration:write), so this looks and
      # explains. It FAILS when publishing is off: the coordinator's only other channel
      # is the Dashboard journal, which lives on the very site that is missing, so
      # GitHub's e-mail is the report. build_type and not mere existence: publishing from
      # a branch serves the repo root, whose index.html points at /src/, so a blank page
      # instead of a 404.
      #
      # FIRST step of this job, before the checkout and the toolchains, and not a job of
      # its own: it still answers in seconds, and it costs no second runner, which was a
      # good ten seconds of the wait between the coordinator's commit and their live site.
      # What is lost is the name GitHub puts in the failure mail, now the workflow's; the
      # `::error::` annotation below carries the title instead, and it is what shows on
      # the run page and in the checks list.
      - name: Is the site allowed to be published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `|| true`: 404 when Pages was never switched on, and gh exits non-zero.
          build_type="$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || true)"
          if [ "$build_type" = "workflow" ]; then
            exit 0
          fi

          if [ -z "$build_type" ]; then
            title="GitHub Pages is not switched on yet"
            symptom="the site address answers 404"
          else
            title="GitHub Pages is publishing from a branch, not from GitHub Actions"
            symptom="the site address shows a blank page"
          fi

          {
            echo "## $title"
            echo
            echo "The site was NOT published, and nothing was lost: everything already"
            echo "sent is safe in this repository. Right now, $symptom."
            echo
            echo "Publishing has to be switched on by a human, once. GitHub does not let"
            echo "any workflow do it for you."
            echo
            echo "1. Open <https://github.com/${{ github.repository }}/settings/pages>"
            echo "2. Under **Source**, choose **GitHub Actions**"
            echo "3. Come back to the **Actions** tab, choose **build** on the left,"
            echo "   then press **Run workflow**"
            echo
            echo "Step 3 is also how you publish the whole site again at any time,"
            echo "without having to upload anything."
          } >> "$GITHUB_STEP_SUMMARY"

          # The annotation carries the whole fix: it is what shows on the run page and
          # in the checks list without opening anything.
          echo "::error title=$title::Settings > Pages > Source > GitHub Actions, then Actions > build > Run workflow. Full instructions in this run's summary."
          exit 1

      # Explicit ref: called from uploads.yml we run inside the run of a push made
      # BEFORE the commit that workflow pushed, so the triggering SHA would publish a
      # site without the voices just processed.
      - name: Checkout (head of the branch, not the triggering SHA)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Node 24: 20 is end-of-life since April 2026. npm 11 skips esbuild's
          # postinstall, harmless since the binary comes from @esbuild/linux-x64.
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install front dependencies
        run: npm ci

      - name: Run tests (normalization + statuses + ZIP contract + journal + contracts)
        run: python -m unittest discover -s scripts/tests -v

      - name: Run front tests (reducer, undo stack, shared helpers)
        run: npm test

      # Derived, so rebuilt here to survive a hand edit in the repo. The index reads the
      # manifests, hence the order. Nothing is committed: only uploads.yml writes.
      - name: Rebuild the manifests and the plays index
        run: |
          python scripts/build_manifest.py
          python scripts/build_plays_index.py

      # No PDF built here: script.pdf is committed data, typeset by uploads.yml on
      # promotion, and rsync carries it into dist/ like any other file. The counterpart
      # is written in .gitignore, uploads.yml and build_script_pdf.py: a script.json
      # edited by hand IN THE REPO keeps its old PDF until the next upload.

      # --exclude='*.html' is mandatory, not a precaution: plays/<id>/*.html are the
      # worktree templates, the dist/ ones are Vite's with hashed asset URLs, so
      # copying over them serves /src/rehearsal/main.jsx and a blank page.
      # The mkdir -p cover a repo with no play at all (fresh fork): plays/ and
      # dist/plays/ then do not exist and rsync fails on a missing source, yet that
      # site is precisely the one carrying the create-a-play page.
      - name: Build site
        run: |
          npm run build
          mkdir -p data plays dist/plays
          cp -r data dist/data
          rsync -a --exclude='*.html' plays/ dist/plays/

      # No `enablement: true`: it needs administration:write, so it could only answer
      # 403, and the action throws on anything but a 409. The first step of this job
      # already guarantees Pages is on and building from a workflow.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      # Since v4 this action excludes hidden files. Keep it that way: the only dotfiles
      # reaching dist/ are the .gitkeep rsync carries along.
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

      # NOT the delivery channel: the install's last step is a commit, not a workflow
      # run, so the coordinator never lands here. GitHub shows them the site itself
      # (Settings > Pages, and the About panel). This is for whoever does open a run,
      # and it is the only place the MANAGEMENT address is spelled out, that one being
      # the site's plus respo.html and linked from nowhere by design.
      - name: Print the site's addresses in the run summary
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          base="${PAGE_URL%/}"
          {
            echo "## The site is online"
            echo
            echo "| Address | For whom |"
            echo "| --- | --- |"
            echo "| <$base/> | the troupe. This is the link you share. |"
            echo "| <$base/respo.html> | you: managing the plays. Bookmark it, nothing links to it from the other address. |"
            echo
            echo "The first one is also on this repository's Settings > Pages, and in"
            echo "the About panel of its front page once you tick \"Use your GitHub"
            echo "Pages website\" there."
          } >> "$GITHUB_STEP_SUMMARY"
